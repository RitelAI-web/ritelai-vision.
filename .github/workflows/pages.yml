name: Publish RitelAI Chart Vision (archive repair deployment)
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare website
        run: |
          mkdir -p site
          cp index.html site/index.html
          if [ -d public ]; then cp -R public/. site/; fi
          test -s site/index.html
          test -s site/sw.js
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          html = open('site/index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, re.I)
          with open('/tmp/ritelai-inline.js', 'w', encoding='utf-8') as f:
              f.write('\n;\n'.join(blocks))
          print(f'Checking {len(blocks)} inline script blocks')
          PY
          node --check /tmp/ritelai-inline.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
