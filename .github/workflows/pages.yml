name: Publish RitelAI Vision

on:
  push:
    branches: [main]
    paths:
      - 'RitelAI_Vision_GitHub_Ready.zip'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application package
        run: |
          mkdir -p extracted site
          unzip -o RitelAI_Vision_GitHub_Ready.zip -d extracted
          APP_DIR="$(find extracted -type f -name index.html -printf '%h\n' | head -n 1)"
          test -n "$APP_DIR"
          cp -a "$APP_DIR"/. site/
          test -s site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
