name: Publish RitelAI Vision

on:
  push:
    branches: [main]
    paths:
      - 'RitelAI_Vision_GitHub_Ready.zip'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application package
        run: |
          mkdir -p extracted site
          unzip -o RitelAI_Vision_GitHub_Ready.zip -d extracted
          APP_DIR="$(find extracted -type f -name index.html -printf '%h\n' | head -n 1)"
          test -n "$APP_DIR"
          cp -a "$APP_DIR"/. site/
          test -s site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("['owner','admin']", "['owner','admin','super_admin']")
          s = s.replace("role==='owner'?'Super Admin'", "['owner','super_admin'].includes(role)?'Super Admin'")
          # Supabase FunctionsHttpError otherwise hides the JSON error returned by the Edge Function.
          old_catch = """  }catch(e){
           console.error(e);
           resultBox.innerHTML='<div class="text-amber-200 font-bold">Analisis belum berhasil</div><p class="muted text-xs mt-2">'+escapeHtml(e.message||'Periksa deployment dan secret Edge Function.')+'</p>';
           toast('Analisis gagal. Lihat pesan pada panel hasil.');
          }"""
          new_catch = """  }catch(e){
           console.error('Chart analysis failed:', e);
           let detail = e?.message || 'Analisis gagal.';
           try {
             const response = e?.context;
             if (response && typeof response.clone === 'function') {
               const raw = await response.clone().text();
               if (raw) {
                 try {
                   const payload = JSON.parse(raw);
                   detail = payload.error || payload.message || payload.msg || raw;
                 } catch (_) { detail = raw; }
               }
             }
           } catch (diagnosticError) { console.warn('Could not read function error body:', diagnosticError); }
           resultBox.innerHTML='<div class="text-amber-200 font-bold">Analisis belum berhasil</div><p class="muted text-xs mt-2">'+escapeHtml(detail)+'</p>';
           toast('Analisis gagal. Lihat pesan pada panel hasil.');
          }"""
          if old_catch in s:
              s = s.replace(old_catch, new_catch, 1)
          else:
              raise SystemExit("Expected analysis catch block was not found; refusing to publish an incomplete diagnostic patch.")

          p.write_text(s, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
