name: Deploy RitelAI News services
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/news-history/**'
      - 'supabase/functions/news-push/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.53.6
      - name: Deploy News History service
        run: supabase functions deploy news-history --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Deploy News Push service
        run: supabase functions deploy news-push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
