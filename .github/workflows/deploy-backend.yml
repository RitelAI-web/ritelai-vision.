name: Deploy RitelAI Supabase functions
on:
  push:
    branches: [main]
    paths:
      - 'RitelAI_Vision_GitHub_Ready.zip'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-backend.yml'
      - 'scripts/patch_backend.py'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.53.6
      - name: Preserve corrected Market Intelligence source
        run: cp supabase/functions/quick-service/index.ts /tmp/quick-service-index.ts
      - name: Preserve corrected chart analysis source
        run: cp supabase/functions/quick-handler/index.ts /tmp/quick-handler-index.ts
      - name: Restore packaged functions
        run: |
          mkdir -p extracted supabase/functions
          unzip -o RitelAI_Vision_GitHub_Ready.zip -d extracted
          APP_DIR="$(dirname "$(find extracted -type f -name index.html -print -quit)")"
          test -f "$APP_DIR/supabase/functions/quick-service/index.ts"
          cp -a "$APP_DIR/supabase/functions/quick-service" supabase/functions/
      - name: Overlay corrected Market Intelligence source
        run: cp /tmp/quick-service-index.ts supabase/functions/quick-service/index.ts
      - name: Overlay corrected chart analysis source
        run: cp /tmp/quick-handler-index.ts supabase/functions/quick-handler/index.ts
      - name: Add cross-market news endpoint
        run: python3 scripts/patch_backend.py
      - name: Ensure Edge Function browser CORS
        run: python3 scripts/patch_cors.py
      - name: Deploy functions
        run: |
          supabase functions deploy quick-service --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy quick-handler --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy mt5-bridge --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Smoke test deployed Market Intelligence endpoints
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          base = "https://brfssdpplapefjmxnpft.supabase.co/functions/v1/quick-service"
          failures = []
          for action, required in [("market_news", "items"), ("market_calendar", "events")]:
              ok = False
              for attempt in range(1, 5):
                  req = urllib.request.Request(base, data=json.dumps({"action": action, "assets": ["XAUUSD","BTCUSD","EURUSD","GBPUSD","USDJPY","US30"]}).encode(), headers={"Content-Type":"application/json"}, method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=35) as response:
                          raw = response.read().decode()
                          payload = json.loads(raw)
                          if response.status == 200 and payload.get("status") == "ok" and required in payload:
                              print(f"PASS {action}: HTTP {response.status}, {required}={len(payload.get(required, []))}")
                              ok = True
                              break
                          detail = raw[:1500]
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode(errors="replace")[:1500]
                      print(f"Attempt {attempt} {action}: HTTP {exc.code}: {detail}")
                  except Exception as exc:
                      detail = f"{type(exc).__name__}: {exc}"
                      print(f"Attempt {attempt} {action}: {detail}")
                  if attempt < 4:
                      time.sleep(attempt * 5)
              if not ok:
                  failures.append(f"{action}: {detail}")
          if failures:
              raise SystemExit("Smoke test failed: " + " | ".join(failures))
          PY
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
