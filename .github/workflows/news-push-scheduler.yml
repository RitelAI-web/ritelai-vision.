name: RitelAI scheduled market push alerts
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  send-news-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check upcoming news and send push alerts
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEWS_PUSH_CRON_SECRET: ${{ secrets.NEWS_PUSH_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$NEWS_PUSH_CRON_SECRET" ]; then
            echo "Missing SUPABASE_PROJECT_REF or NEWS_PUSH_CRON_SECRET repository secrets"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/news-push" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $NEWS_PUSH_CRON_SECRET" \
            -d '{}'
